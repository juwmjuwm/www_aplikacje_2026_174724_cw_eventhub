<article class="card">
    <div>
        <span class="badge">{{ event.category.name }}</span>
        <h2>{{ event.title }}</h2>
        <p class="meta">
            <strong>Termin:</strong> {{ event.date|date:"d M Y, H:i" }}<br>
            <strong>Miejsce:</strong> {{ event.location }}<br>
            <strong>Cena:</strong> {% if event.price == 0 %}Bezpłatne{% else %}{{ event.price }} PLN{% endif %}<br>
            <strong>Za:</strong> {{ event.date|timeuntil }}
        </p>
        <p>{{ event.description|truncatewords:20 }}</p>
    </div>
    <a href="{% url 'events:event-detail' event.slug %}" class="btn">Zobacz szczegóły</a>
</article>
